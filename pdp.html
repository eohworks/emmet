<!doctype html>
<html lang="en" data-theme="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emmett — Product</title>
<link rel="icon" href="assets/svg/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme-neutral.css">
<script src="nav-scroll.js" defer></script>
</head>
<body class="pdp-body">

<div class="pdp-shell">
  <header class="site-header">
    <a href="plp.html" class="nav-link">Shop</a>
    <!-- --nav-logo-fill overridden locally to a mid-gray — see index.html's
         comment: the neutral theme's --color-accent-logo is pure black, and the
         chrome shimmer's mix-blend-mode:overlay needs a lighter base to show. -->
    <a href="index.html" class="site-logo" aria-label="Emmett home" style="--nav-logo-fill:#9a9a9a;">
      <span class="site-logo-svg" id="siteLogo"></span>
      <span class="liquid-metal liquid-metal--logo liquid-metal--chrome" aria-hidden="true"><span class="liquid-metal-spin"></span></span>
    </a>
    <a href="#" class="nav-link" id="cartLink">Cart</a>
  </header>

  <main class="pdp">
    <div class="pdp-gallery-frame">
      <div class="pdp-gallery" id="pdpGallery">
        <img id="pdpMainImage" src="" alt="">
        <img src="assets/character-art.jpg" alt="Emmett necklace, lifestyle photo">
      </div>
      <div class="pdp-gallery-dots" id="pdpGalleryDots">
        <span class="is-active"></span>
        <span></span>
      </div>
    </div>

    <div class="pdp-details">
      <div class="pdp-top-row">
        <h1 class="pdp-name" id="pdpName">Item One</h1>
        <emmet-color-picker id="colorPicker" options="gold,silver" value="silver"></emmet-color-picker>
      </div>

      <p class="pdp-description" id="pdpDescription"></p>
      <div class="pdp-bottom-row">
        <p class="pdp-price" id="pdpPrice"></p>
        <button type="button" class="btn-bag btn-bag--large" id="pdpAddBtn">Add To Cart</button>
      </div>

      <div class="pdp-accordions">
        <div class="pdp-accordion">
          <button type="button" class="pdp-accordion-trigger" aria-expanded="false" data-accordion-trigger>
            Details
            <span class="pdp-accordion-icon" aria-hidden="true"></span>
          </button>
          <div class="pdp-accordion-panel">
            <div class="pdp-accordion-panel-inner">
              <p class="pdp-sku" id="pdpSku"></p>
            </div>
          </div>
        </div>
        <div class="pdp-accordion">
          <button type="button" class="pdp-accordion-trigger" aria-expanded="false" data-accordion-trigger>
            Shipping
            <span class="pdp-accordion-icon" aria-hidden="true"></span>
          </button>
          <div class="pdp-accordion-panel">
            <div class="pdp-accordion-panel-inner">
              <p class="pdp-accordion-text">Ships within 3–5 business days. Free returns within 30 days.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<footer class="site-footer">
  <div class="footer-mark" aria-hidden="true">
    <span class="footer-mark-svg" id="footerMark"></span>
    <span class="liquid-metal liquid-metal--symbol liquid-metal--chrome" aria-hidden="true"><span class="liquid-metal-spin"></span></span>
  </div>
  <div class="footer-links">
    <a href="#" class="footer-link">Contact</a>
    <a href="#" class="footer-link">About</a>
    <a href="#" class="footer-link">Legal</a>
    <a href="#" class="footer-link">Social</a>
  </div>
</footer>

<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer-head">
    <span class="cart-title">Cart</span>
    <button class="cart-close" id="cartClose" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 1L15 15M15 1L1 15"/></svg></button>
  </div>
  <p class="cart-empty" id="cartEmpty">Your cart is empty.</p>
  <div class="cart-items" id="cartItems" style="display:none"></div>
  <div class="cart-summary" id="cartSummary" style="display:none">
    <span>Subtotal</span>
    <span id="cartSubtotal"></span>
  </div>
  <button type="button" class="cart-checkout-btn" id="cartCheckoutBtn" style="display:none">Checkout</button>
  <p class="cart-note">Demo storefront — checkout is not connected to any payment or order system.</p>
</aside>

<script src="products.js"></script>
<script src="cart-neutral.js"></script>
<script src="components.js"></script>
<script>
  fetch("assets/svg/logo.svg").then((r) => r.text()).then((svg) => {
    document.getElementById("siteLogo").innerHTML = svg;
  });
  fetch("assets/svg/symbol.svg").then((r) => r.text()).then((svg) => {
    document.getElementById("footerMark").innerHTML = svg;
  });

  const params = new URLSearchParams(location.search);
  const itemKey = PRODUCTS[params.get("item")] ? params.get("item") : "one";
  let finish = ["silver", "gold"].includes(params.get("finish")) ? params.get("finish") : "silver";

  const product = PRODUCTS[itemKey];

  const nameEl = document.getElementById("pdpName");
  const descEl = document.getElementById("pdpDescription");
  const priceEl = document.getElementById("pdpPrice");
  const skuEl = document.getElementById("pdpSku");
  const colorPicker = document.getElementById("colorPicker");
  const mainImage = document.getElementById("pdpMainImage");
  const pdpGallery = document.getElementById("pdpGallery");

  function renderProduct() {
    nameEl.textContent = `${product.name} (${product.sku})`;
    descEl.textContent = product.description.replace("{material}", MATERIAL_LABEL[finish]);
    priceEl.textContent = `$${product.price}`;
    skuEl.textContent = `SKU ${product.sku}-${finish.toUpperCase()}`;
    colorPicker.setAttribute("value", finish);
    mainImage.src = product.images[finish];
    mainImage.alt = `${product.name}, ${finish} finish`;
    pdpGallery.scrollTo({ top: 0, left: 0, behavior: "smooth" });
  }

  // Dot indicators only matter for the mobile carousel (horizontal snap-scroll);
  // on desktop the gallery scrolls vertically and scrollLeft stays 0, so this
  // stays harmlessly inert there.
  const galleryDots = document.querySelectorAll("#pdpGalleryDots span");
  pdpGallery.addEventListener("scroll", () => {
    const index = Math.round(pdpGallery.scrollLeft / pdpGallery.clientWidth);
    galleryDots.forEach((dot, i) => dot.classList.toggle("is-active", i === index));
  });
  galleryDots.forEach((dot, i) => {
    dot.addEventListener("click", () => {
      pdpGallery.scrollTo({ left: i * pdpGallery.clientWidth, behavior: "smooth" });
    });
  });

  colorPicker.addEventListener("change", (e) => {
    finish = e.detail.value;
    renderProduct();
  });

  const addBtn = document.getElementById("pdpAddBtn");
  addBtn.addEventListener("click", () => {
    Cart.add({ name: product.name, finish, price: product.price, image: product.images[finish] });
    Cart.open();
    addBtn.textContent = "Added";
    addBtn.classList.add("is-added");
    setTimeout(() => {
      addBtn.textContent = "Add To Cart";
      addBtn.classList.remove("is-added");
    }, 1200);
  });

  renderProduct();

  // Details/Shipping accordions — independent, not exclusive (opening one
  // doesn't close the other). max-height transition (see styles.css) needs
  // no JS-measured height since the panels' real content is short and
  // comfortably inside the fixed cap.
  document.querySelectorAll("[data-accordion-trigger]").forEach((trigger) => {
    trigger.addEventListener("click", () => {
      const accordion = trigger.closest(".pdp-accordion");
      const isOpen = accordion.classList.toggle("is-open");
      trigger.setAttribute("aria-expanded", String(isOpen));
    });
  });
</script>
</body>
</html>
